name: Atualizar Dividendos (Java)

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Compilar e executar Scraper
        run: mvn compile exec:java -Dexec.mainClass="Scraper"

      - name: Salvar JSON no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dividendos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza dividendos" && git push)
