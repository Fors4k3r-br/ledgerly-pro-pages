name: Atualizar Dividendos (Java)

on:
  schedule:
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e executar Scraper
        run: mvn compile exec:java -Dexec.mainClass="Scraper"

      - name: Salvar JSON no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dividendos.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dividendos"

            git pull --rebase origin main || true

            git push origin HEAD:main
          else
            echo "Nenhuma alteração encontrada."
          fi
