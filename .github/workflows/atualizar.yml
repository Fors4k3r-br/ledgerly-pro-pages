name: Atualizar Dividendos (Java)

on:
#  schedule:
#    - cron: "15 09 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Com falhar_no_erro=true o Java grava o JSON (status "erro") e sai com exit code 1.
      # Este step falha e o workflow fica marcado como falho na aba Actions.
      - name: Compilar e executar Scraper
        id: scraper
        run: mvn compile exec:java -Dexec.mainClass="Scraper"

      # Roda mesmo que o Scraper tenha falhado, para publicar o diagnóstico de erro.
      # Não roda se o checkout/setup falhou (scraper "skipped") nem se o workflow foi cancelado.
      - name: Salvar JSON no repositorio
        if: ${{ !cancelled() && steps.scraper.conclusion != 'skipped' }}
        run: |
          if [ ! -f dividendos.json ]; then
            echo "dividendos.json não foi gerado; nada para commitar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dividendos.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dividendos"

            git pull --rebase origin main || git rebase --abort

            git push origin HEAD:main
          else
            echo "Nenhuma alteração encontrada."
          fi
