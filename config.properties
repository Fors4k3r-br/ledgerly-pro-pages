# Configuração do Scraper de dividendos
# Todas as chaves são opcionais: se faltar alguma, o Scraper usa o valor padrão abaixo.
# ATENÇÃO: em arquivos .properties a barra invertida é caractere de escape.
# Nos regex use barra dupla: \\d (e não \d).

# ---------- Fonte e saída ----------
url=https://www.dadosdemercado.com.br/agenda-de-dividendos
arquivo_saida=dividendos.json

# ---------- Rede ----------
user_agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
timeout_ms=15000
tentativas=3

# ---------- Comportamento em caso de problema ----------
# Fração máxima de linhas rejeitadas pela validação (0.20 = 20%).
# Acima disso a coleta é considerada inválida e o cache é mantido.
max_percentual_rejeitadas=0.20

# true = o programa termina com exit code 1 quando a coleta falha (útil em CI)
falhar_no_erro=true

# ---------- Colunas da tabela ----------
# Nomes dos cabeçalhos, sem acento, em minúsculas, separados por vírgula.
# Basta o cabeçalho do site começar com o nome (ex.: "valor" casa com "Valor (R$)").
coluna.codigo=codigo
coluna.tipo=tipo
coluna.valor=valor
coluna.registro=registro
coluna.ex=ex
coluna.pagamento=pagamento

# ---------- Validação ----------
# Ações (PETR4, SANB11) e BDRs (A1GI34)
regex_ticker=^[A-Z0-9]{4}\\d{1,2}$
# Formato do site: 0,017250
regex_valor=^\\d{1,3}(\\.\\d{3})*,\\d+$
# Padrão de data (java.time). Use uuuu para o ano.
formato_data=dd/MM/uuuu
